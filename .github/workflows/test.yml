name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.10 --seed .venv
      - run: uv pip install --python .venv/bin/python -e . --group dev
      - run: .venv/bin/pytest -q
      - run: .venv/bin/ruff check tap_workday tests
      - run: .venv/bin/ruff format --check tap_workday tests
