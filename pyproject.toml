[tool.poetry]
name = "tap-workday"
version = "0.0.1"
description = "`tap-workday` is a Singer tap for workday, built with the Meltano SDK for Singer Taps."
authors = ["Hotglue"]
keywords = [
    "ELT",
    "workday",
]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
hotglue-singer-sdk = "==1.0.53"
requests = ">=2.32,<3"
urllib3 = ">=1.26.20,<3"
defusedxml = "^0.7.1"

[dependency-groups]
dev = ["pytest>=8,<10", "responses>=0.25,<0.27", "ruff>=0.15"]

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-workday = "tap_workday.tap:TapWorkday.cli"

[tool.tox]
requires = [
    "tox>=4.43",
    "tox-uv",
]
env_list = [
    "lint",
    "3.10",
]

[tool.tox.env_run_base]
description = "run tests on Python {env_name}"
runner = "uv-venv-runner"
pass_env = [
    "TAP_WORKDAY_*",
]
deps = ["pytest>=8,<10", "responses>=0.25,<0.27"]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]

[tool.tox.env.lint]
description = "run ruff linter and formatter check"
skip_install = true
deps = ["ruff>=0.15"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]
